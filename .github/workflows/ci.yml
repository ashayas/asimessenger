name: CI
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 8 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test
      - run: pnpm test:e2e
      - name: Build unsigned app
        run: pnpm dist
      - run: pnpm test:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: ASI-Messenger-unsigned
          path: release/*.dmg
      - name: Attach unsigned build to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "ASI Messenger $GITHUB_REF_NAME" --generate-notes
          for f in release/*.dmg; do cp "$f" "${f%.dmg}-unsigned.dmg"; done
          gh release upload "$GITHUB_REF_NAME" release/*-unsigned.dmg --clobber
